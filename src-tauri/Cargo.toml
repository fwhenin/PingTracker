[package]
name = "pingtracker"
version = "0.1.0"
description = "Menu bar / system tray app that tracks ping latency over time"
authors = ["PingTracker"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pingtracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
chrono = { version = "0.4", features = ["clock"] }
netdev = "0.36"
log = "0.4"

[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
